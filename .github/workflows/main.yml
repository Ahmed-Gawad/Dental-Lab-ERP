name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Typecheck & Web Build (Linux, fast) ──────────────────────────────
  typecheck-and-web:
    name: Typecheck + Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Web build (dist/public)
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/public/
          retention-days: 7

  # ── Job 2: Windows EXE Build (Installer + Portable) ─────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: typecheck-and-web
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build Windows Installer + Portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-exe

      - name: Upload all exe files
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe
          retention-days: 30

  # ── Job 3: GitHub Release ─────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: ${{ github.ref_name }}
          body: |
            ## A to Z Digital Service — نظام إدارة مختبر الأسنان
            ### ${{ github.ref_name }}

            **ملفات التحميل المتاحة:**
            - 📦 **`A to Z Digital Service Setup.exe`** — ملف التثبيت الكامل (Installer) مع اختصارات سطح المكتب
            - 🚀 **`A to Z Digital Service-Portable.exe`** — نسخة محمولة (Portable) تعمل مباشرة بدون تثبيت

            كلاهما يحتوي على نفس البرنامج الكامل مع قاعدة البيانات المحلية.

            ---
            **كيفية الترقية التلقائية:** سيتحقق البرنامج من وجود تحديثات عند التشغيل تلقائياً (يعمل فقط في نسخة Installer).
          draft: false
          prerelease: false
