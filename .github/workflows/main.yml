name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install app native deps (prebuilt binaries)
        run: npx electron-builder install-app-deps

      - name: Build Vite
        run: npx vite build --config vite.electron.config.ts

      - name: Build Windows EXE
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload exe files
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: ${{ github.ref_name }}
          body: |
            ## A to Z Digital Service — نظام إدارة مختبر الأسنان
            - 📦 Setup.exe — ملف تثبيت كامل
            - 🚀 Portable.exe — نسخة محمولة بدون تثبيت
          draft: false
          prerelease: false
